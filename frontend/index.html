<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Flow Builder</title>
    <link rel="icon" type="image/svg+xml" href="/frontend/assets/sparkle-mark.svg" />
    <link rel="apple-touch-icon" href="/frontend/assets/sparkle-mark.svg" />
    <!-- Faces are declared in the app's stylesheet (styles/fonts.css);
         preloading the two that render first keeps text from flashing a fallback. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/frontend/assets/fonts/IBMPlexSans-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/frontend/assets/fonts/IBMPlexMono-400-latin.woff2" />
    <!-- Built by `npm run build:frontend` from flow-builder/styles/app.css. -->
    <link rel="stylesheet" href="/frontend/app.css" />
    <!-- The app's stylesheet only styles the builder, never the page around it,
         so this page — like any host — sets its own page-level basics. -->
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/frontend/app.js"></script>
  </body>
</html>
